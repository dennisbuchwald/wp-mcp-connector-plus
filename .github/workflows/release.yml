# A tag should produce the file people actually install.
#
# Without this, the only download is GitHub's source archive: its folder
# carries the ref in its name ("wp-mcp-connector-plus-0.18.0"), so
# WordPress installs the plugin under that name and the next update
# arrives as a second copy. The asset built here has the plain folder
# name, and the update checker prefers it over the source archive.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The same suite as on every push. A release is the one build that
  # reaches other people's sites, so it never goes out untested.
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Three places carry the version: the tag, the header WordPress and
      # the update checker read, and the constant the plugin reports and
      # versions its assets with. One forgotten bump and an update either
      # never arrives or arrives forever.
      - name: Check that tag, header and constant agree
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER="$(sed -n 's/^[ *]*Version: *\([^ ]*\).*/\1/p' wp-mcp-connector-plus.php | head -1)"
          CONSTANT="$(sed -n "s/^define( 'WPMCP_VERSION', '\([^']*\)' );/\1/p" wp-mcp-connector-plus.php)"
          echo "tag: ${VERSION}, header: ${HEADER}, constant: ${CONSTANT}"
          test -n "${HEADER}" && test -n "${CONSTANT}"
          test "${HEADER}" = "${VERSION}"
          test "${CONSTANT}" = "${VERSION}"

      - name: Build the install ZIP
        run: |
          mkdir -p build
          # git archive honours export-ignore, so tests and the repo's own
          # plumbing stay out of what gets installed.
          git archive --format=tar --prefix=wp-mcp-connector-plus/ HEAD | tar -x -C build
          # Docs are for the repository page, not for a WordPress server:
          # their examples contain the same markup a firewall objects to.
          rm -f build/wp-mcp-connector-plus/README.md build/wp-mcp-connector-plus/CHANGELOG.md
          test -f build/wp-mcp-connector-plus/vendor/autoload.php
          (cd build && zip -qr "../wp-mcp-connector-plus.zip" wp-mcp-connector-plus)
          unzip -l wp-mcp-connector-plus.zip | tail -1

      # A firewall such as ModSecurity reads the upload and refuses the
      # whole plugin over one attack string, and the test suite is full of
      # them on purpose. export-ignore keeps it out today; this makes sure
      # a renamed folder or a fixture moved into includes/ cannot quietly
      # undo that.
      - name: Check the ZIP for what a firewall refuses
        run: |
          if unzip -Z1 wp-mcp-connector-plus.zip | grep -E '^wp-mcp-connector-plus/tests/'; then
            echo "::error::The ZIP contains the tests/ directory."
            exit 1
          fi
          if grep -rlF -e 'alert(1)' -e 'document.cookie' build/wp-mcp-connector-plus; then
            echo "::error::The ZIP contains an attack string a server firewall would refuse."
            exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: wp-mcp-connector-plus.zip
